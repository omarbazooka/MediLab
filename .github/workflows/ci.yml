name: Phase 0 QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Unit tests and code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Sync locked dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Unit tests
        run: uv run pytest tests/unit

  docker-runtime:
    name: Docker, PostgreSQL and pgvector
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Sync locked dependencies
        run: uv sync --frozen
      - name: Validate Compose configuration
        run: docker compose config
      - name: Build and start stack
        run: docker compose up -d --build
      - name: Wait for application health
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:5000/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs web db
          exit 1
      - name: Verify pgvector in running database
        run: |
          docker compose exec -T db \
            psql -U postgres -d medilab -v ON_ERROR_STOP=1 \
            -c "SELECT extversion FROM pg_extension WHERE extname = 'vector';" \
            -c "SELECT '[1,2,3]'::vector;"
      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/medilab
        run: uv run flask db upgrade
      - name: Run real PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/medilab
        run: uv run pytest -m postgres
      - name: Show container status
        if: always()
        run: docker compose ps
      - name: Tear down stack
        if: always()
        run: docker compose down -v
