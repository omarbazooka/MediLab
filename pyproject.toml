[project]
name = "medilab-ai"
version = "0.1.0"
description = "MediLab AI - Diagnostic Laboratory AI Sales & Customer Service Agent"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "MediLab Engineering Team" }
]
dependencies = [
    "flask>=3.0.0",
    "flask-sqlalchemy>=3.1.0",
    "flask-migrate>=4.0.0",
    "psycopg[binary]>=3.1.0",
    "pgvector>=0.3.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pymupdf>=1.28.2",
    "langchain-text-splitters>=1.1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-flask>=1.3.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
markers = [
    "postgres: requires a real PostgreSQL instance with pgvector available",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
